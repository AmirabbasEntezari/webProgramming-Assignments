services:
  httpbin:
    image: ghcr.io/mccutchen/go-httpbin
    environment:
      - PORT=8081
    networks:
      - internal          

  proxy:
    build: ./proxy
    ports:
      - "85:85"           
    environment:
      - BACKEND_URL=http://httpbin:8081
      - JWT_SECRET=change-me-to-a-long-random-string
      - AUTH_USER=admin
      - AUTH_PASS=secret123
    depends_on:
      - httpbin
    networks:
      - internal
      - public

networks:
  internal:
    internal: true        
  public: